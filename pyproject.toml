[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moliya-agent"
version = "0.1.0"
description = "Hermes/OpenAI orqali Telegram moliya yozuvlarini Google Sheets'ga tasdiq bilan yozish"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
moliya-api = "moliya_agent.main:main"
moliya-telegram-bot = "moliya_agent.telegram_bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
